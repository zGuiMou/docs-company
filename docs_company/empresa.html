<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Perfil da entidade — Docs Company</title>
  <style>
    :root{--bg:#05070a;--panel:#0c141d;--text:#f5f7fa;--muted:#9aaabb;--line:rgba(255,255,255,.1);--blue:#73b5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#05070a,#091018);color:var(--text);font:15px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;width:min(1120px,calc(100% - 32px));display:flex;justify-content:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:15px;background:rgba(5,7,10,.82);backdrop-filter:blur(16px)}.brand{position:absolute;left:18px;font-weight:900;font-size:19px}.dot{color:var(--blue)}.nav a:not(.brand){padding:7px 10px;color:#b8c5d4;font-size:13px}.nav a:hover{color:#fff}.wrap{width:min(1060px,calc(100% - 36px));margin:auto;padding:116px 0 56px}.back{display:inline-block;color:var(--blue);font-weight:700;margin-bottom:18px}.hero{position:relative;min-height:300px;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#132b45,#0d1723)}.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,13,.9),rgba(4,8,13,.32),rgba(4,8,13,.68))}.hero-content{position:relative;z-index:1;display:flex;align-items:end;gap:20px;min-height:300px;padding:34px}.logo{width:112px;height:112px;flex:none;display:grid;place-items:center;overflow:hidden;border:3px solid rgba(255,255,255,.35);border-radius:28px;background:linear-gradient(135deg,#5aa6ff,#a4d1ff);color:#07131d;font-size:39px;font-weight:900}.logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#a8d4ff;font-weight:800}.hero h1{margin:7px 0;font-size:clamp(35px,6vw,64px);line-height:.95;letter-spacing:-.065em}.tagline{margin:0;color:#d8e5f3;font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;margin-top:22px}.card{padding:24px;border:1px solid var(--line);border-radius:18px;background:rgba(12,20,29,.82)}h2{margin:0 0 14px;font-size:19px}p{line-height:1.75;color:var(--muted);white-space:pre-wrap}.facts{display:grid;gap:13px}.fact{padding:13px;border:1px solid var(--line);border-radius:12px}.fact span{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.fact strong{display:block;margin-top:5px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}textarea,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#07111b;color:var(--text);font:inherit}button{margin-top:9px;padding:9px 13px;border:0;border-radius:9px;background:linear-gradient(135deg,#5aa6ff,#91c8ff);color:#041018;font-weight:900;cursor:pointer}.comment{padding:15px 0;border-bottom:1px solid var(--line)}.comment:last-child{border:0}.comment small{color:var(--muted)}.admin{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.admin label{display:block;margin-top:10px;color:#c9d8e9;font-size:12px;font-weight:700}.notice{color:var(--muted);font-size:13px}.error{padding:30px;text-align:center}.loading{opacity:.55}@media(max-width:720px){.brand{display:none}.nav{width:calc(100% - 18px);top:9px}.nav a:not(.brand){padding:7px 5px;font-size:11px}.wrap{width:min(100% - 24px,1060px);padding-top:85px}.hero-content{padding:22px;align-items:center}.logo{width:76px;height:76px;border-radius:20px;font-size:28px}.layout{grid-template-columns:1fr}.gallery img{height:130px}}
  </style>
</head>
<body>
  <nav class="nav"><a class="brand" href="index.html">DOCS<span class="dot">.</span></a><a href="index.html">Início</a><a href="servicos.html">Soluções</a><a href="licitacoes.html">Licitações</a><a href="parceiros.html">Entidades</a></nav>
  <main class="wrap" id="page"><a class="back" href="parceiros.html">← Todas as entidades</a><div class="card loading">Carregando perfil…</div></main>
  <script src="runtime-api.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const page = document.getElementById('page'); let company, isAdmin = false, currentUser = null;
    const esc = value => { const el=document.createElement('span'); el.textContent=value||''; return el.innerHTML; };
    const initials = name => String(name||'E').split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase();
    const api = path => `http://localhost:3000${path}`;
    async function loadComments(){ const r=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{cache:'no-store'}); const data=await r.json(); const host=document.getElementById('comments'); if(!data.comments.length){host.innerHTML='<p class="notice">Ainda não há comentários. Seja a primeira pessoa a participar.</p>';return;} host.innerHTML=data.comments.map(c=>`<article class="comment"><strong>${esc(c.user.username)}</strong><small> · ${new Date(c.createdAt).toLocaleDateString('pt-BR')}</small><p>${esc(c.body)}</p></article>`).join(''); }
    function render(){ const logo=company.logoUrl?`<img src="${esc(company.logoUrl)}" alt="Logo de ${esc(company.name)}">`:initials(company.name); const banner=company.bannerUrl?`<img class="banner" src="${esc(company.bannerUrl)}" alt="">`:''; const gallery=(company.mediaUrls||[]).map(url=>`<img src="${esc(url)}" alt="Mídia de ${esc(company.name)}">`).join(''); page.innerHTML=`<a class="back" href="parceiros.html">← Todas as entidades</a><section class="hero">${banner}<div class="hero-shade"></div><div class="hero-content"><div class="logo">${logo}</div><div><div class="eyebrow">${esc(company.entityType)}</div><h1>${esc(company.name)}<span class="dot">.</span></h1><p class="tagline">${esc(company.profileTagline || company.industry)}</p></div></div></section><section class="layout"><div><article class="card"><h2>Sobre a entidade</h2><p>${esc(company.description || 'Esta entidade ainda não publicou uma descrição institucional.')}</p></article>${gallery?`<article class="card" style="margin-top:22px"><h2>Mídias</h2><div class="gallery">${gallery}</div></article>`:''}<article class="card" style="margin-top:22px"><h2>Comunidade</h2><div id="comments"></div><div id="commentComposer" style="display:none"><textarea id="commentBody" rows="4" maxlength="1500" placeholder="Compartilhe sua experiência com esta entidade"></textarea><button id="sendComment">Publicar comentário</button></div><p id="loginNotice" class="notice"></p></article></div><aside><article class="card"><h2>Informações</h2><div class="facts"><div class="fact"><span>Segmento</span><strong>${esc(company.industry)}</strong></div><div class="fact"><span>Avaliação</span><strong>${company.ratingCount?`★ ${Number(company.rating).toFixed(1)} / 5`:'Sem avaliações'}</strong></div><div class="fact"><span>Opiniões</span><strong>${company.ratingCount||0}</strong></div></div><div class="admin" id="admin"><h2>Administrar perfil</h2><label>Frase de destaque<input id="tagline" maxlength="180" value="${esc(company.profileTagline)}"></label><label>Descrição<textarea id="description" rows="5">${esc(company.description)}</textarea></label><label>Logo (URL HTTPS)<input id="logoUrl" value="${esc(company.logoUrl)}"></label><label>Banner (URL HTTPS)<input id="bannerUrl" value="${esc(company.bannerUrl)}"></label><label>Mídias (uma URL HTTPS por linha)<textarea id="mediaUrls" rows="5">${esc((company.mediaUrls||[]).join('\n'))}</textarea></label><button id="saveProfile">Salvar perfil</button></div></article></aside></section>`; if(isAdmin)document.getElementById('admin').style.display='block'; if(currentUser){document.getElementById('commentComposer').style.display='block'}else document.getElementById('loginNotice').textContent='Entre com Discord para comentar.'; document.getElementById('sendComment')?.addEventListener('click',sendComment); document.getElementById('saveProfile')?.addEventListener('click',saveProfile); loadComments(); }
    async function sendComment(){const body=document.getElementById('commentBody').value.trim();if(!body)return;const r=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});if(!r.ok)return alert('Não foi possível publicar o comentário.');document.getElementById('commentBody').value='';loadComments();}
    async function saveProfile(){const payload={name:company.name,entityType:company.entityType,industry:company.industry,estimatedNetWorth:company.estimatedNetWorth,profileTagline:document.getElementById('tagline').value.trim(),description:document.getElementById('description').value.trim(),logoUrl:document.getElementById('logoUrl').value.trim(),bannerUrl:document.getElementById('bannerUrl').value.trim(),mediaUrls:document.getElementById('mediaUrls').value.split('\n').map(v=>v.trim()).filter(Boolean)};const r=await fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)return alert(data.error||'Não foi possível salvar.');company=data.company;render();}
    async function start(){if(!id){page.innerHTML='<div class="card error">Entidade não informada. <a href="parceiros.html">Voltar ao catálogo</a></div>';return;}const [profile,auth]=await Promise.all([fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{cache:'no-store'}),fetch(api('/auth/me'),{credentials:'include'})]);if(!profile.ok){page.innerHTML='<div class="card error">Perfil não encontrado. <a href="parceiros.html">Voltar ao catálogo</a></div>';return;}company=(await profile.json()).company;const session=await auth.json();isAdmin=!!session.isAdmin;currentUser=session.user||null;document.title=`${company.name} — Docs Company`;render();}start().catch(()=>page.innerHTML='<div class="card error">Não foi possível carregar este perfil.</div>');
  </script>
</body>
</html>
