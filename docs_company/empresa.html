<!doctype html>
<html lang="pt-BR">
<head>

  <title>Perfil da entidade — Docs Company</title>
  <style>
    :root{--bg:#05070a;--panel:#0c141d;--text:#f5f7fa;--muted:#9aaabb;--line:rgba(255,255,255,.1);--blue:#73b5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#05070a,#091018);color:var(--text);font:15px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;width:min(1120px,calc(100% - 32px));display:flex;justify-content:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:15px;background:rgba(5,7,10,.82);backdrop-filter:blur(16px)}.brand{position:absolute;left:18px;font-weight:900;font-size:19px}.dot{color:var(--blue)}.nav a:not(.brand){padding:7px 10px;color:#b8c5d4;font-size:13px}.nav a:hover{color:#fff}.wrap{width:min(1060px,calc(100% - 36px));margin:auto;padding:116px 0 56px}.back{display:inline-block;color:var(--blue);font-weight:700;margin-bottom:18px}.hero{position:relative;min-height:300px;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#132b45,#0d1723)}.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,13,.9),rgba(4,8,13,.32),rgba(4,8,13,.68))}.hero-content{position:relative;z-index:1;display:flex;align-items:end;gap:20px;min-height:300px;padding:34px}.logo{width:112px;height:112px;flex:none;display:grid;place-items:center;overflow:hidden;border:3px solid rgba(255,255,255,.35);border-radius:28px;background:linear-gradient(135deg,#5aa6ff,#a4d1ff);color:#07131d;font-size:39px;font-weight:900}.logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#a8d4ff;font-weight:800}.hero h1{margin:7px 0;font-size:clamp(35px,6vw,64px);line-height:.95;letter-spacing:-.065em}.tagline{margin:0;color:#d8e5f3;font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;margin-top:22px}.card{padding:24px;border:1px solid var(--line);border-radius:18px;background:rgba(12,20,29,.82)}h2{margin:0 0 14px;font-size:19px}p{line-height:1.75;color:var(--muted);white-space:pre-wrap}.facts{display:grid;gap:13px}.fact{padding:13px;border:1px solid var(--line);border-radius:12px}.fact span{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.fact strong{display:block;margin-top:5px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.team{margin-top:22px;background:linear-gradient(135deg,rgba(48,115,186,.22),rgba(12,20,29,.9))}.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.member{padding:14px;border-radius:12px;border:1px solid rgba(115,181,255,.3);background:rgba(4,12,20,.45)}.member b,.member span{display:block}.member span{margin-top:5px;color:#a8d4ff;font-size:12px}.member small{display:block;margin-top:7px;color:var(--muted)}.member button{background:transparent;border:1px solid var(--line);color:var(--text);font-size:11px}.member-form{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.member-form input:last-of-type{grid-column:1/-1}textarea,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#07111b;color:var(--text);font:inherit}button{margin-top:9px;padding:9px 13px;border:0;border-radius:9px;background:linear-gradient(135deg,#5aa6ff,#91c8ff);color:#041018;font-weight:900;cursor:pointer}.comment{padding:15px 0;border-bottom:1px solid var(--line)}.comment:last-child{border:0}.comment small{color:var(--muted)}.admin{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.admin label{display:block;margin-top:10px;color:#c9d8e9;font-size:12px;font-weight:700}.notice{color:var(--muted);font-size:13px}.error{padding:30px;text-align:center}.loading{opacity:.55}@media(max-width:720px){.brand{display:none}.nav{width:calc(100% - 18px);top:9px}.nav a:not(.brand){padding:7px 5px;font-size:11px}.wrap{width:min(100% - 24px,1060px);padding-top:85px}.hero-content{padding:22px;align-items:center}.logo{width:76px;height:76px;border-radius:20px;font-size:28px}.layout{grid-template-columns:1fr}.gallery img{height:130px}.member-form{grid-template-columns:1fr}}
    .member-avatar{width:42px;height:42px;display:grid;place-items:center;float:left;margin:0 10px 8px 0;overflow:hidden;border-radius:50%;background:#6dadff;color:#07131d;font-weight:900}.member-avatar img{width:100%;height:100%;object-fit:cover}.member:after{content:"";display:block;clear:both}
  </style>
  <style>.auth-link{position:absolute;right:14px;border-radius:8px;background:linear-gradient(135deg,#ff8a00,#ffb347);color:#081017!important;font-weight:800}.profile-user-pill{position:absolute;right:14px;top:9px;display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.03);font-weight:800}.profile-user-avatar{width:30px;height:30px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,#5aa6ff,#84c4ff);color:#07131d;font-size:12px}.profile-user-avatar img{width:100%;height:100%;object-fit:cover}.profile-logout{padding:7px 10px!important;border:1px solid rgba(255,255,255,.07);border-radius:8px;color:#aeb8c5!important;font-size:13px!important}.hero-stats{display:flex;gap:9px;margin-top:15px}.hero-stat{padding:8px 11px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(3,8,14,.5);font-size:12px}.hero-stat strong{display:block;font-size:15px}.hero-stat span{color:#c7d8e9;font-size:10px;text-transform:uppercase;letter-spacing:.08em}</style>
</head>
<body>
  <nav class="nav"><a class="brand" href="index.html">DOCS<span class="dot">.</span></a><a href="index.html">Início</a><a href="servicos.html">Soluções</a><a href="licitacoes.html">Licitações</a><a href="parceiros.html">Entidades</a><span id="authLink"><a class="auth-link" href="/auth/discord">Entrar com Discord</a></span></nav>
  <main class="wrap" id="page"><a class="back" href="parceiros.html">← Todas as entidades</a><div class="card loading">Carregando perfil…</div></main>
  <script src="runtime-api.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const page = document.getElementById('page'); let company, isAdmin = false, currentUser = null, members = [], canManage = false;
    const esc = value => { const el=document.createElement('span'); el.textContent=value||''; return el.innerHTML; };
    const initials = name => String(name||'E').split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase();
    function mountTeam(){
      let section = document.getElementById('teamSection');
      if (!section) {
        section = document.createElement('section'); section.id = 'teamSection'; section.className = 'card team';
        section.innerHTML = '<h2>Quadro Societário &amp; Colaboradores</h2><p class="notice">Perfis vinculados oficialmente à entidade.</p><div class="team-grid" id="teamGrid"></div><div class="member-form" id="memberForm"><input id="memberUsername" maxlength="80" placeholder="Nome de usuário no Discord"><input id="memberRole" maxlength="100" placeholder="Cargo"><button id="addMember">Adicionar vinculado</button></div>';
        const sidebar = page.querySelector('.layout > aside');
        const infoCard = sidebar.querySelector('.card');
        infoCard.querySelector('h2')?.remove();
        infoCard.querySelector('.facts')?.remove();
        sidebar.insertBefore(section, sidebar.firstChild);
        document.getElementById('addMember').addEventListener('click', addMember);
      }
      document.getElementById('memberForm').style.display = isAdmin ? 'grid' : 'none';
      const host = document.getElementById('teamGrid');
      host.innerHTML = members.length ? members.map(member => `<article class="member"><b>${esc(member.name)}</b><span>${esc(member.role)}</span>${member.discord ? `<small>${esc(member.discord)}</small>` : ''}${isAdmin ? `<button data-member-id="${member.id}">Remover</button>` : ''}</article>`).join('') : '<p class="notice">A equipe ainda não foi cadastrada.</p>';
      host.innerHTML = members.length ? members.map(member => { const avatar = member.user.avatar ? `https://cdn.discordapp.com/avatars/${member.user.id}/${member.user.avatar}.${member.user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=128` : ''; return `<article class="member"><div class="member-avatar">${avatar ? `<img src="${avatar}" alt="">` : esc(initials(member.user.username))}</div><b>${esc(member.user.username)}</b><span>${esc(member.role)}</span>${isAdmin ? `<button data-member-id="${member.id}">Remover</button>` : ''}</article>`; }).join('') : '<p class="notice">Nenhum colaborador vinculado foi cadastrado.</p>';
      host.querySelectorAll('[data-member-id]').forEach(button => button.addEventListener('click', () => removeMember(button.dataset.memberId)));
    }
    async function loadMembers(){ const response = await fetch(api(`/api/empresas/${encodeURIComponent(id)}/colaboradores`), { cache:'no-store' }); if (!response.ok) return; members = (await response.json()).members || []; mountTeam(); }
    async function removeMember(memberId){ if(!confirm('Remover este colaborador?')) return; const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/colaboradores/${encodeURIComponent(memberId)}`),{method:'DELETE',credentials:'include'}); if(!response.ok) return alert('Não foi possível remover este colaborador.'); loadMembers(); }
    async function addMember(){ const username=document.getElementById('memberUsername').value.trim(), role=document.getElementById('memberRole').value.trim(); if(!username || !role) return alert('Informe o usuário do Discord e o cargo.'); const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/colaboradores`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,role})}); const data=await response.json(); if(!response.ok) return alert(data.error || 'Não foi possível adicionar este colaborador.'); document.getElementById('memberUsername').value='';document.getElementById('memberRole').value='';loadMembers(); }
    function enhanceCommunity(){ const composer=document.getElementById('commentComposer'); if(isAdmin && composer && !document.getElementById('communityImageUrl')) { const input=document.createElement('input'); input.id='communityImageUrl';input.placeholder='Imagem da publicação (URL HTTPS, opcional)';input.style.marginTop='8px';composer.querySelector('button').before(input); } }
    async function loadComments(){ const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{cache:'no-store'}); if(!response.ok)return; const data=await response.json(),host=document.getElementById('comments'); if(!host)return; host.innerHTML=(data.comments||[]).length?(data.comments||[]).map(comment=>{const avatar=comment.user.avatar?`https://cdn.discordapp.com/avatars/${comment.user.id}/${comment.user.avatar}.${comment.user.avatar.startsWith('a_')?'gif':'png'}?size=128`:'';return `<article class="comment"><div class="member-avatar">${avatar?`<img src="${avatar}" alt="">`:esc(initials(comment.user.username))}</div><strong>${esc(comment.user.username)}</strong><small> · ${new Date(comment.createdAt).toLocaleDateString('pt-BR')}</small><p>${esc(comment.body)}</p>${comment.imageUrl?`<img src="${esc(comment.imageUrl)}" alt="Imagem da publicação" style="width:100%;max-height:420px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">`:''}</article>`}).join(''):'<p class="notice">Ainda não há comentários. Seja a primeira pessoa a participar.</p>'; }
    async function sendComment(){const body=document.getElementById('commentBody').value.trim(),imageUrl=document.getElementById('communityImageUrl')?.value.trim()||'';if(!body)return;const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,imageUrl})});const data=await response.json();if(!response.ok)return alert(data.error||'Não foi possível publicar o comentário.');document.getElementById('commentBody').value='';if(document.getElementById('communityImageUrl'))document.getElementById('communityImageUrl').value='';loadComments();}
    function decorateProfile(){
      const heroText = page.querySelector('.hero-content > div:last-child');
      if (heroText && !document.getElementById('heroStats')) heroText.insertAdjacentHTML('beforeend', `<div class="hero-stats" id="heroStats"><div class="hero-stat"><span>Avaliação</span><strong>${company.ratingCount ? `★ ${Number(company.rating).toFixed(1)}` : 'Sem avaliações'}</strong></div><div class="hero-stat"><span>Opiniões</span><strong>${company.ratingCount || 0}</strong></div></div>`);
      const auth = document.getElementById('authLink');
      if (auth) auth.innerHTML = currentUser ? `<a class="auth-link" href="/auth/logout">Sair (${esc(currentUser.username)})</a>` : '<a class="auth-link" href="/auth/discord">Entrar com Discord</a>';
    }
    let observedHero = null;
    setInterval(() => { const hero = page.querySelector('.hero'); if (company && hero && hero !== observedHero) { observedHero = hero; decorateProfile(); loadMembers(); enhanceCommunity(); } }, 100);
    const api = path => `http://localhost:3000${path}`;
    async function loadComments(){ const r=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{cache:'no-store'}); const data=await r.json(); const host=document.getElementById('comments'); if(!data.comments.length){host.innerHTML='<p class="notice">Ainda não há comentários. Seja a primeira pessoa a participar.</p>';return;} host.innerHTML=data.comments.map(c=>`<article class="comment"><strong>${esc(c.user.username)}</strong><small> · ${new Date(c.createdAt).toLocaleDateString('pt-BR')}</small><p>${esc(c.body)}</p></article>`).join(''); }
    function render(){ const logo=company.logoUrl?`<img src="${esc(company.logoUrl)}" alt="Logo de ${esc(company.name)}">`:initials(company.name); const banner=company.bannerUrl?`<img class="banner" src="${esc(company.bannerUrl)}" alt="">`:''; const gallery=(company.mediaUrls||[]).map(url=>`<img src="${esc(url)}" alt="Mídia de ${esc(company.name)}">`).join(''); page.innerHTML=`<a class="back" href="parceiros.html">← Todas as entidades</a><section class="hero">${banner}<div class="hero-shade"></div><div class="hero-content"><div class="logo">${logo}</div><div><div class="eyebrow">${esc(company.entityType)}</div><h1>${esc(company.name)}<span class="dot">.</span></h1><p class="tagline">${esc(company.profileTagline || company.industry)}</p></div></div></section><section class="layout"><div><article class="card"><h2>Sobre a entidade</h2><p>${esc(company.description || 'Esta entidade ainda não publicou uma descrição institucional.')}</p></article>${gallery?`<article class="card" style="margin-top:22px"><h2>Mídias</h2><div class="gallery">${gallery}</div></article>`:''}<article class="card" style="margin-top:22px"><h2>Comunidade</h2><div id="comments"></div><div id="commentComposer" style="display:none"><textarea id="commentBody" rows="4" maxlength="1500" placeholder="Compartilhe sua experiência com esta entidade"></textarea><button id="sendComment">Publicar comentário</button></div><p id="loginNotice" class="notice"></p></article></div><aside><article class="card"><h2>Informações</h2><div class="facts"><div class="fact"><span>Segmento</span><strong>${esc(company.industry)}</strong></div><div class="fact"><span>Avaliação</span><strong>${company.ratingCount?`★ ${Number(company.rating).toFixed(1)} / 5`:'Sem avaliações'}</strong></div><div class="fact"><span>Opiniões</span><strong>${company.ratingCount||0}</strong></div></div><div class="admin" id="admin"><h2>Administrar perfil</h2><label>Frase de destaque<input id="tagline" maxlength="180" value="${esc(company.profileTagline)}"></label><label>Descrição<textarea id="description" rows="5">${esc(company.description)}</textarea></label><label>Logo (URL HTTPS)<input id="logoUrl" value="${esc(company.logoUrl)}"></label><label>Banner (URL HTTPS)<input id="bannerUrl" value="${esc(company.bannerUrl)}"></label><label>Mídias (uma URL HTTPS por linha)<textarea id="mediaUrls" rows="5">${esc((company.mediaUrls||[]).join('\n'))}</textarea></label><button id="saveProfile">Salvar perfil</button></div></article></aside></section>`; if(isAdmin)document.getElementById('admin').style.display='block'; if(currentUser){document.getElementById('commentComposer').style.display='block'}else document.getElementById('loginNotice').textContent='Entre com Discord para comentar.'; document.getElementById('sendComment')?.addEventListener('click',sendComment); document.getElementById('saveProfile')?.addEventListener('click',saveProfile); loadComments(); }
    async function sendComment(){const body=document.getElementById('commentBody').value.trim();if(!body)return;const r=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});if(!r.ok)return alert('Não foi possível publicar o comentário.');document.getElementById('commentBody').value='';loadComments();}
    async function saveProfile(){const payload={name:company.name,entityType:company.entityType,industry:company.industry,estimatedNetWorth:company.estimatedNetWorth,profileTagline:document.getElementById('tagline').value.trim(),description:document.getElementById('description').value.trim(),logoUrl:document.getElementById('logoUrl').value.trim(),bannerUrl:document.getElementById('bannerUrl').value.trim(),mediaUrls:document.getElementById('mediaUrls').value.split('\n').map(v=>v.trim()).filter(Boolean)};const r=await fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)return alert(data.error||'Não foi possível salvar.');company=data.company;render();}
    async function start(){if(!id){page.innerHTML='<div class="card error">Entidade não informada. <a href="parceiros.html">Voltar ao catálogo</a></div>';return;}const [profile,auth]=await Promise.all([fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{cache:'no-store'}),fetch(api('/auth/me'),{credentials:'include'})]);if(!profile.ok){page.innerHTML='<div class="card error">Perfil não encontrado. <a href="parceiros.html">Voltar ao catálogo</a></div>';return;}company=(await profile.json()).company;const session=await auth.json();isAdmin=!!session.isAdmin;currentUser=session.user||null;document.title=`${company.name} — Docs Company`;render();}start().catch(()=>page.innerHTML='<div class="card error">Não foi possível carregar este perfil.</div>');
    function avatar(user){ return user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${user.avatar.startsWith('a_')?'gif':'png'}?size=128` : ''; }
    function postComment(postId){ const field=document.getElementById(`postComment-${postId}`), body=field.value.trim(); if(!body)return; fetch(api(`/api/posts/${encodeURIComponent(postId)}/comentarios`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})}).then(async response=>{if(!response.ok){const data=await response.json();throw new Error(data.error)}field.value='';loadComments();}).catch(error=>alert(error.message||'Não foi possível comentar.')); }
    function deletePostItem(itemId){ if(!confirm('Excluir esta publicação ou comentário?'))return; fetch(api(`/api/comentarios/${encodeURIComponent(itemId)}`),{method:'DELETE',credentials:'include'}).then(response=>{if(!response.ok)throw new Error();loadComments();}).catch(()=>alert('Não foi possível excluir.')); }
    async function loadComments(){ const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/posts`),{cache:'no-store'}); if(!response.ok)return; const data=await response.json(),host=document.getElementById('comments'); if(!host)return; const card=host.closest('.card'); card.querySelector('h2').textContent='Posts'; host.innerHTML=data.posts.length?data.posts.map(post=>`<article class="comment"><div class="member-avatar">${avatar(post.user)?`<img src="${avatar(post.user)}" alt="">`:esc(initials(post.user.username))}</div><strong>${esc(post.user.username)}</strong><small> · ${new Date(post.createdAt).toLocaleDateString('pt-BR')}</small>${isAdmin?`<button data-delete="${post.id}" style="float:right">Excluir</button>`:''}<p>${esc(post.body)}</p><img src="${esc(post.imageUrl)}" alt="Imagem do post" style="width:100%;max-height:420px;object-fit:cover;border-radius:12px;border:1px solid var(--line)"><div style="margin-top:14px;padding-left:12px;border-left:2px solid var(--line)">${post.comments.map(comment=>`<article class="comment"><div class="member-avatar">${avatar(comment.user)?`<img src="${avatar(comment.user)}" alt="">`:esc(initials(comment.user.username))}</div><strong>${esc(comment.user.username)}</strong><small> · ${new Date(comment.createdAt).toLocaleDateString('pt-BR')}</small>${isAdmin?`<button data-delete="${comment.id}" style="float:right">Excluir</button>`:''}<p>${esc(comment.body)}</p></article>`).join('')}${currentUser?`<textarea id="postComment-${post.id}" rows="2" maxlength="1500" placeholder="Comentar este post"></textarea><button data-comment-post="${post.id}">Comentar</button>`:'<p class="notice">Entre com Discord para comentar.</p>'}</div></article>`).join(''):'<p class="notice">Ainda não há posts.</p>'; host.querySelectorAll('[data-comment-post]').forEach(button=>button.addEventListener('click',()=>postComment(button.dataset.commentPost))); host.querySelectorAll('[data-delete]').forEach(button=>button.addEventListener('click',()=>deletePostItem(button.dataset.delete))); const composer=document.getElementById('commentComposer'); composer.style.display=isAdmin?'block':'none'; document.getElementById('loginNotice').textContent=isAdmin?'Publique uma imagem e uma mensagem institucional.':currentUser?'Comente diretamente nos posts.':'Entre com Discord para comentar.'; if(isAdmin&&!document.getElementById('communityImageUrl')){const input=document.createElement('input');input.id='communityImageUrl';input.placeholder='Imagem do post (URL HTTPS obrigatória)';input.style.marginTop='8px';composer.querySelector('button').before(input);} }
    async function sendComment(){ const body=document.getElementById('commentBody').value.trim(),imageUrl=document.getElementById('communityImageUrl')?.value.trim(); if(!body||!imageUrl)return alert('Todo post precisa de imagem e mensagem.'); const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/posts`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,imageUrl})}); const data=await response.json(); if(!response.ok)return alert(data.error||'Não foi possível publicar.'); document.getElementById('commentBody').value='';document.getElementById('communityImageUrl').value='';loadComments(); }
    function enhanceCommunity() {
      document.getElementById('mediaUrls')?.closest('label')?.remove();
      [...page.querySelectorAll('h2')].find(heading => heading.textContent === 'Mídias')?.closest('.card')?.remove();
      const composer = document.getElementById('commentComposer');
      composer?.querySelector('button') && (composer.querySelector('button').textContent = 'Publicar post');
      const notice = document.getElementById('loginNotice');
      if (notice && !notice.dataset.postNotice) {
        notice.dataset.postNotice = 'true';
        new MutationObserver(() => { if (isAdmin) notice.textContent = ''; }).observe(notice, { childList: true });
      }
    }
    async function saveProfile(){ const payload={name:company.name,entityType:company.entityType,industry:company.industry,estimatedNetWorth:company.estimatedNetWorth,profileTagline:document.getElementById('tagline').value.trim(),description:document.getElementById('description').value.trim(),logoUrl:document.getElementById('logoUrl').value.trim(),bannerUrl:document.getElementById('bannerUrl').value.trim()}; const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); if(!response.ok)return alert(data.error||'Não foi possível salvar.'); company=data.company;render(); }
    function enhanceCommunity() {
      document.getElementById('mediaUrls')?.closest('label')?.remove();
      [...page.querySelectorAll('h2')].find(heading => heading.textContent === 'Mídias')?.closest('.card')?.remove();
      const composer = document.getElementById('commentComposer');
      const postBody = document.getElementById('commentBody');
      if (postBody) postBody.placeholder = 'Publique anúncios, comunicados e notícias para manter sua comunidade sempre informada e conectada.';
      composer?.querySelector('button') && (composer.querySelector('button').textContent = 'Publicar post');
      const notice = document.getElementById('loginNotice');
      if (notice && !notice.dataset.postNotice) {
        notice.dataset.postNotice = 'true';
        new MutationObserver(() => { if (isAdmin) notice.textContent = ''; }).observe(notice, { childList: true });
      }
    }
    function decorateProfile() {
      const heroText = page.querySelector('.hero-content > div:last-child');
      if (heroText && !document.getElementById('heroStats')) heroText.insertAdjacentHTML('beforeend', `<div class="hero-stats" id="heroStats"><div class="hero-stat"><span>Avaliação</span><strong>${company.ratingCount ? `★ ${Number(company.rating).toFixed(1)}` : 'Sem avaliações'}</strong></div><div class="hero-stat"><span>Opiniões</span><strong>${company.ratingCount || 0}</strong></div></div>`);
      const auth = document.getElementById('authLink');
      if (!auth) return;
      if (!currentUser) { auth.innerHTML = '<a class="auth-link" href="/auth/discord">Entrar com Discord</a>'; return; }
      const avatar = currentUser.avatar ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.${currentUser.avatar.startsWith('a_') ? 'gif' : 'png'}?size=128` : '';
      auth.innerHTML = `<div class="profile-user-pill"><span class="profile-user-avatar">${avatar ? `<img src="${avatar}" alt="">` : esc(initials(currentUser.username))}</span><span>${esc(currentUser.username)}</span><a class="profile-logout" href="/auth/logout">Sair</a></div>`;
    }
    function installPostEditors(){
      if (!canManage) return;
      const composer = document.getElementById('commentComposer');
      if (composer) {
        composer.style.display = 'block';
        if (!document.getElementById('communityImageUrl')) {
          const input = document.createElement('input'); input.id = 'communityImageUrl'; input.placeholder = 'Imagem do post (URL HTTPS obrigatória)'; input.style.marginTop = '8px';
          composer.querySelector('button').before(input);
        }
      }
      document.querySelectorAll('[id^="postComment-"]').forEach(field => {
        const postId = field.id.slice('postComment-'.length), article = field.closest('article.comment');
        if (!article || article.querySelector('[data-edit-post]')) return;
        const button = document.createElement('button'); button.type = 'button'; button.textContent = 'Editar post'; button.dataset.editPost = postId;
        button.addEventListener('click', async () => {
          const body = prompt('Mensagem do post:', article.querySelector('p')?.textContent || '');
          if (body === null) return;
          const imageUrl = prompt('URL HTTPS da imagem:', article.querySelector(':scope > img')?.src || '');
          if (!imageUrl) return;
          const response = await fetch(api(`/api/posts/${encodeURIComponent(postId)}`), { method:'PATCH', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({body,imageUrl}) });
          const data = await response.json(); if (!response.ok) return alert(data.error || 'Não foi possível editar o post.'); loadComments();
        });
        article.append(button);
      });
    }
    async function resolveCompanyAccess(){
      if (!currentUser || !company) return;
      const response = await fetch(api('/api/my-company'), { credentials:'include' });
      const data = await response.json();
      canManage = isAdmin || Boolean(data.company && String(data.company.id) === String(company.id));
      if (!canManage) { document.getElementById('admin')?.closest('.card')?.remove(); return; }
      document.getElementById('admin') && (document.getElementById('admin').style.display = 'block');
      installPostEditors();
    }
    const companyAccessWatcher = setInterval(() => { if (company && currentUser) { clearInterval(companyAccessWatcher); resolveCompanyAccess(); } }, 150);
    const postEditorWatcher = setInterval(installPostEditors, 500);
    async function saveProfile(){ const payload={name:company.name,entityType:company.entityType,industry:company.industry,estimatedNetWorth:company.estimatedNetWorth,profileTagline:document.getElementById('tagline')?.value.trim() || company.profileTagline,description:document.getElementById('description')?.value.trim() || '',logoUrl:document.getElementById('logoUrl')?.value.trim() || company.logoUrl,bannerUrl:document.getElementById('bannerUrl')?.value.trim() || company.bannerUrl}; const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); if(!response.ok)return alert(data.error||'Não foi possível salvar.'); company=data.company;render(); }
    const discordAvatar = user => user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=128` : '';
    async function loadFeedback(){ const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/opinioes`),{cache:'no-store'}); if(!response.ok)return; const data=await response.json(),host=document.getElementById('feedbackComments'); if(!host)return; host.innerHTML=data.comments.length?data.comments.map(comment=>`<article class="comment"><div class="member-avatar">${discordAvatar(comment.user)?`<img src="${discordAvatar(comment.user)}" alt="">`:esc(initials(comment.user.username))}</div><strong>${esc(comment.user.username)}</strong><small> · ${new Date(comment.createdAt).toLocaleDateString('pt-BR')}</small><p>${esc(comment.body)}</p></article>`).join(''):'<p class="notice">Ainda não há comentários sobre esta entidade.</p>'; }
    function paintStars(value){ document.querySelectorAll('#ratingButtons button').forEach((button,index)=>{ button.style.color=index < value ? '#ffca6a' : '#617080'; }); }
    async function sendRating(value){ const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/avaliacoes`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({value})}); if(!response.ok)return alert('Entre com Discord para avaliar.'); company.rating=Number(value); company.ratingCount=Math.max(1,Number(company.ratingCount)||0); document.getElementById('feedbackRating').textContent=`Sua avaliação: ${value} / 5`; paintStars(value); }
    async function sendFeedback(){ const field=document.getElementById('feedbackBody'),body=field.value.trim(); if(!body)return; const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/opinioes`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})}); if(!response.ok)return alert('Entre com Discord para comentar.'); field.value='';loadFeedback(); }
    function mountFeedback(){
      if (!company || document.getElementById('feedbackSection')) return;
      const section=document.createElement('section'); section.id='feedbackSection';section.className='card';section.style.marginTop='22px';
      section.innerHTML=`<h2>Avaliações e comentários</h2><p id="feedbackRating" class="notice">Avalie esta entidade de 1 a 5 estrelas.</p><div id="ratingButtons" style="display:flex;gap:6px;font-size:25px;color:#ffca6a"></div><div id="feedbackComments"></div><div id="feedbackComposer" style="display:none"><textarea id="feedbackBody" rows="3" maxlength="1500" placeholder="Deixe um comentário sobre esta entidade"></textarea><button id="sendFeedback">Enviar comentário</button></div>`;
      page.querySelector('.layout > div > article.card').insertAdjacentElement('afterend',section);
      const buttons=document.getElementById('ratingButtons'); [1,2,3,4,5].forEach(value=>{const button=document.createElement('button');button.type='button';button.textContent='★';button.title=`${value} estrela${value>1?'s':''}`;button.style.cssText='margin:0;padding:0;background:transparent;color:#617080;font-size:25px';button.addEventListener('click',()=>sendRating(value));buttons.append(button);});
      fetch(api(`/api/empresas/${encodeURIComponent(id)}/avaliacoes`),{credentials:'include',cache:'no-store'}).then(response=>response.json()).then(data=>{if(data.myRating){paintStars(data.myRating);document.getElementById('feedbackRating').textContent=`Sua avaliação: ${data.myRating} / 5`;}}).catch(()=>undefined);
      if(currentUser)document.getElementById('feedbackComposer').style.display='block'; document.getElementById('sendFeedback').addEventListener('click',sendFeedback);loadFeedback();
    }
    const feedbackWatcher=setInterval(()=>{if(company&&page.querySelector('.layout')){mountFeedback();if(document.getElementById('feedbackSection'))clearInterval(feedbackWatcher);}},150);
  </script>
</body>
</html>
