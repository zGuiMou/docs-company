<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    :root{--bg:#05070a;--panel:#0c141d;--text:#f5f7fa;--muted:#9aaabb;--line:rgba(255,255,255,.1);--blue:#73b5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#05070a,#091018);color:var(--text);font:15px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;width:min(1120px,calc(100% - 32px));display:flex;justify-content:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:15px;background:rgba(5,7,10,.82);backdrop-filter:blur(16px)}.brand{position:absolute;left:18px;font-weight:900;font-size:19px}.dot{color:var(--blue)}.nav a:not(.brand){padding:7px 10px;color:#b8c5d4;font-size:13px}.nav a:hover{color:#fff}.wrap{width:min(1060px,calc(100% - 36px));margin:auto;padding:116px 0 56px}.back{display:inline-block;color:var(--blue);font-weight:700;margin-bottom:18px}.hero{position:relative;min-height:300px;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#132b45,#0d1723)}.banner{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,13,.9),rgba(4,8,13,.32),rgba(4,8,13,.68))}.hero-content{position:relative;z-index:1;display:flex;align-items:end;gap:20px;min-height:300px;padding:34px}.logo{width:112px;height:112px;flex:none;display:grid;place-items:center;overflow:hidden;border:3px solid rgba(255,255,255,.35);border-radius:28px;background:linear-gradient(135deg,#5aa6ff,#a4d1ff);color:#07131d;font-size:39px;font-weight:900}.logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:#a8d4ff;font-weight:800}.hero h1{margin:7px 0;font-size:clamp(35px,6vw,64px);line-height:.95;letter-spacing:-.065em}.tagline{margin:0;color:#d8e5f3;font-size:17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;margin-top:22px}.card{padding:24px;border:1px solid var(--line);border-radius:18px;background:rgba(12,20,29,.82)}h2{margin:0 0 14px;font-size:19px}p{line-height:1.75;color:var(--muted);white-space:pre-wrap}.facts{display:grid;gap:13px}.fact{padding:13px;border:1px solid var(--line);border-radius:12px}.fact span{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.fact strong{display:block;margin-top:5px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;height:180px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.team{margin-top:22px;background:linear-gradient(135deg,rgba(48,115,186,.22),rgba(12,20,29,.9))}.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.member{padding:14px;border-radius:12px;border:1px solid rgba(115,181,255,.3);background:rgba(4,12,20,.45)}.member b,.member span{display:block}.member span{margin-top:5px;color:#a8d4ff;font-size:12px}.member small{display:block;margin-top:7px;color:var(--muted)}.member button{background:transparent;border:1px solid var(--line);color:var(--text);font-size:11px}.member-form{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.member-form input:last-of-type{grid-column:1/-1}textarea,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#07111b;color:var(--text);font:inherit}button{margin-top:9px;padding:9px 13px;border:0;border-radius:9px;background:linear-gradient(135deg,#5aa6ff,#91c8ff);color:#041018;font-weight:900;cursor:pointer}.comment{padding:15px 0;border-bottom:1px solid var(--line)}.comment:last-child{border:0}.comment small{color:var(--muted)}.admin{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.admin label{display:block;margin-top:10px;color:#c9d8e9;font-size:12px;font-weight:700}.notice{color:var(--muted);font-size:13px}.error{padding:30px;text-align:center}.loading{opacity:.55}@media(max-width:720px){.brand{display:none}.nav{width:calc(100% - 18px);top:9px}.nav a:not(.brand){padding:7px 5px;font-size:11px}.wrap{width:min(100% - 24px,1060px);padding-top:85px}.hero-content{padding:22px;align-items:center}.logo{width:76px;height:76px;border-radius:20px;font-size:28px}.layout{grid-template-columns:1fr}.gallery img{height:130px}.member-form{grid-template-columns:1fr}}
    .member-avatar{width:42px;height:42px;display:grid;place-items:center;float:left;margin:0 10px 8px 0;overflow:hidden;border-radius:50%;background:#6dadff;color:#07131d;font-weight:900}.member-avatar img{width:100%;height:100%;object-fit:cover}.member:after{content:"";display:block;clear:both}
    @media(max-width:720px){.nav{flex-wrap:wrap;padding:7px;row-gap:2px}.nav #authLink{width:100%;display:flex;justify-content:center}.auth-link,.profile-user-pill{position:static!important}.profile-user-pill{font-size:12px}.wrap{padding-top:132px}}

  <style>.auth-link{position:absolute;right:14px;border-radius:8px;background:linear-gradient(135deg,#ff8a00,#ffb347);color:#081017!important;font-weight:800}.profile-user-pill{position:absolute;right:14px;top:9px;display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid rgba(255,255,255,.07);border-radius:11px;background:rgba(255,255,255,.03);font-weight:800}.profile-user-avatar{width:30px;height:30px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,#5aa6ff,#84c4ff);color:#07131d;font-size:12px}.profile-user-avatar img{width:100%;height:100%;object-fit:cover}.profile-logout{padding:7px 10px!important;border:1px solid rgba(255,255,255,.07);border-radius:8px;color:#aeb8c5!important;font-size:13px!important}.hero-stats{display:flex;gap:9px;margin-top:15px}.hero-stat{padding:8px 11px;border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(3,8,14,.5);font-size:12px}.hero-stat strong{display:block;font-size:15px}.hero-stat span{color:#c7d8e9;font-size:10px;text-transform:uppercase;letter-spacing:.08em}</style>
  <style>
    .post-edit-modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(1,4,8,.78);backdrop-filter:blur(8px)}.post-edit-modal.open{display:grid}.post-edit-dialog{width:min(590px,100%);padding:24px;border:1px solid rgba(115,181,255,.32);border-radius:18px;background:linear-gradient(150deg,#111e2b,#091018);box-shadow:0 28px 90px rgba(0,0,0,.55)}.post-edit-dialog h2{margin:0}.post-edit-dialog .modal-subtitle{margin:7px 0 18px;color:var(--muted);font-size:13px}.post-edit-dialog label{display:block;margin:14px 0 6px;color:#cfe3f8;font-size:12px;font-weight:800}.post-edit-dialog textarea{min-height:150px;resize:vertical}.post-edit-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.post-edit-actions button{margin:0}.post-edit-cancel{background:transparent!important;border:1px solid var(--line)!important;color:#c8d4e1!important}.hero-stats{flex-wrap:wrap;align-items:center}.entity-link-btn{margin:0!important;padding:9px 12px!important;background:linear-gradient(135deg,#347fe8,#68afff)!important;color:#03162d!important;white-space:nowrap}.entity-link-btn:disabled{opacity:.78;cursor:default}.entity-link-btn.linked{background:rgba(90,166,255,.18)!important;border:1px solid rgba(90,166,255,.5)!important;color:#cfe7ff!important}.context-edit-btn{margin:0 0 0 9px!important;padding:6px 9px!important;border:1px solid rgba(115,181,255,.45)!important;background:rgba(115,181,255,.12)!important;color:#dceeff!important;font-size:11px}.hero-edit-btn{margin-top:13px!important}.card h2 .context-edit-btn{vertical-align:middle}#admin>h2,#admin>label,#admin>#saveProfile{display:none}.verified-badge{display:inline-grid;place-items:center;width:24px;height:24px;margin-left:8px;border-radius:50%;vertical-align:middle;background:#36c88c;color:#06261a;font-family:Arial,sans-serif;font-size:15px;font-weight:900;letter-spacing:0;cursor:help;box-shadow:0 0 0 3px rgba(54,200,140,.16)}@media(max-width:520px){.post-edit-modal{padding:12px}.post-edit-dialog{padding:18px}.post-edit-actions{flex-direction:column-reverse}.post-edit-actions button{width:100%}}
  </style>
  <style>
    .nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;width:min(1120px,calc(100% - 32px));display:flex;align-items:center;justify-content:center;padding:9px 12px;border:1px solid var(--line);background:rgba(5,7,10,.78);backdrop-filter:blur(18px);border-radius:15px;box-shadow:0 18px 40px rgba(0,0,0,.18);gap:0}.brand-wrap{display:flex;flex-direction:row;align-items:center;gap:10px;position:absolute;left:18px}.brand{display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;letter-spacing:-.06em;position:static}.brand-text{display:inline-flex;align-items:flex-start;flex-direction:column;line-height:1}.brand-main{display:inline-flex;align-items:center;letter-spacing:-.06em}.brand-sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#aeb8c5;margin-top:4px}.brand-mark{width:48px;height:48px;display:block;filter:drop-shadow(0 12px 22px rgba(43,102,255,.32))}.brand-mark svg{width:100%;height:100%;display:block}.brand-mark .mark-core{fill:#f5f7fa}.brand-mark .mark-cut{fill:#080c11}.brand-mark .mark-dot{fill:#2c6df6}.navlinks{display:flex;gap:3px}.navlinks a{padding:9px 13px!important;border:1px solid transparent;border-radius:8px;color:#aeb8c5!important;font-size:13px!important;transition:.2s}.navlinks a:hover{color:#fff!important;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18)}.discord-login{position:absolute;right:18px;top:10px;z-index:24;display:inline-flex;align-items:center;gap:10px;padding:9px 14px;border-radius:10px;background:linear-gradient(135deg,#ff8a00,#ffb347);color:#081017!important;font-weight:800;border:1px solid rgba(255,140,36,.16);box-shadow:0 10px 30px rgba(255,138,36,.12);font-size:13px;text-transform:uppercase}.user-pill{position:absolute;right:18px;top:10px;z-index:24;display:flex;align-items:center;gap:8px;height:38px;max-width:calc(100% - 36px);padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);font-weight:700}.user-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover}.user-avatar img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}.user-avatar.initials{display:grid;place-items:center;background:linear-gradient(135deg,#5aa6ff,#84c4ff);color:#07131d;font-weight:800}.user-name{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#eaf6ff;font-size:13px}.logout-btn{padding:6px 10px!important;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,.06);color:var(--muted)!important;font-size:13px!important}@media(max-width:1100px){.nav{justify-content:flex-start;flex-wrap:wrap;gap:6px}.brand{display:none}.navlinks{flex:1 1 auto;width:auto;justify-content:center}.nav #authLink{display:flex;margin-left:auto;flex:0 0 auto}.discord-login,.user-pill{position:static!important}}@media(max-width:720px){.nav{top:10px;width:calc(100% - 20px);padding:7px}.navlinks{flex:1 0 100%;width:100%;order:1}.navlinks a{padding:8px 7px!important;font-size:11px!important}.nav #authLink{width:100%;margin:0;justify-content:center;order:2}.wrap{padding-top:172px}}

<body>
  <header class="nav"><a class="brand" href="index.html"><span class="brand-wrap"><span class="brand-mark" aria-label="Logo DOCS"><svg viewBox="0 0 120 120" role="img" aria-hidden="true"><path class="mark-core" d="M30 16H62C90 16 108 34 108 60C108 86 90 104 62 104H30V16ZM52 36V84H62C77 84 88 76 88 60C88 44 77 36 62 36H52Z"/><path class="mark-cut" d="M60 38H62C74 38 82 47 82 60C82 73 74 82 62 82H60V38Z"/><circle class="mark-dot" cx="94" cy="90" r="14"/></svg></span><span class="brand-text"><span class="brand-main">DOCS<span class="dot">.</span></span><span class="brand-sub">Company</span></span></span></a><nav class="navlinks"><a href="index.html">Início</a><a href="servicos.html">Nossas Soluções</a><a href="licitacoes.html">Licitações e Contratos</a><a href="entidades.html">Entidades</a></nav><div id="authLink"><a class="discord-login" href="/auth/discord">Entrar com Discord</a></div></header>
  <main class="wrap" id="page"><a class="back" href="entidades.html">← Todas as entidades</a><div class="card loading">Carregando perfil…</div></main>
  <script src="runtime-api.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const page = document.getElementById('page'); let company, isAdmin = false, currentUser = null, members = [], canManage = false;
    const esc = value => { const el=document.createElement('span'); el.textContent=value||''; return el.innerHTML; };
    const initials = name => String(name||'E').split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase();
    function officialCard(label, official, linked){ const image=official.imageUrl?`<img src="${esc(official.imageUrl)}" alt="">`:esc(initials(official.name)); return `<article class="member"><div class="member-avatar">${image}</div><b>${esc(official.name)}</b><span>${label}${linked?' · Vinculado ao Discord':''}</span></article>`; }
    function mountOfficials(){
      let section=document.getElementById('teamSection'); const officials=company.officials||{}, president=officials.presidente||{}, mayor=officials.prefeito||{};
      if(!section){ section=document.createElement('section');section.id='teamSection';section.className='card team';const sidebar=page.querySelector('.layout > aside'),infoCard=sidebar.querySelector('.card');infoCard.querySelector('h2')?.remove();infoCard.querySelector('.facts')?.remove();sidebar.insertBefore(section,sidebar.firstChild); }
      section.innerHTML=`<h2>Agentes e Servidores Públicos</h2><p class="notice">Quadro institucional da prefeitura.</p><div class="team-grid">${officialCard('Presidente',president,false)}${officialCard('Prefeito',mayor,mayor.linked)}</div><div class="member-form" id="officialForm"><input id="presidentName" maxlength="100" placeholder="Nome do Presidente" value="${esc(president.name==='Não informado'?'':president.name)}"><input id="presidentImage" placeholder="Imagem HTTPS do Presidente" value="${esc(president.imageUrl||'')}"><input id="mayorName" maxlength="100" placeholder="Nome informativo do Prefeito" value="${esc(mayor.linked?'':mayor.name==='Não informado'?'':mayor.name)}"><input id="mayorImage" placeholder="Imagem HTTPS do Prefeito" value="${esc(mayor.linked?'':mayor.imageUrl||'')}"><input id="mayorUsername" maxlength="80" placeholder="Usuário Discord do Prefeito (opcional)" value=""><button id="saveOfficials">Salvar quadro público</button></div>`;
      document.getElementById('saveOfficials').addEventListener('click',saveOfficials); refreshOfficialControls();
    }
    function refreshOfficialControls(){ const form=document.getElementById('officialForm');if(form)form.style.display=canManage?'grid':'none'; }
    async function saveOfficials(){ const payload={presidenteName:document.getElementById('presidentName').value.trim(),presidenteImageUrl:document.getElementById('presidentImage').value.trim(),prefeitoName:document.getElementById('mayorName').value.trim(),prefeitoImageUrl:document.getElementById('mayorImage').value.trim(),prefeitoUsername:document.getElementById('mayorUsername').value.trim()};const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/autoridades`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)return alert(data.error||'Não foi possível salvar o quadro.');const profile=await fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{cache:'no-store'});company=(await profile.json()).company;render();}
    function mountTeam(){
      if (company.entityType === 'PREFEITURA') { mountOfficials(); return; }
      let section = document.getElementById('teamSection');
      if (!section) {
        section = document.createElement('section'); section.id = 'teamSection'; section.className = 'card team';
        section.innerHTML = '<h2>Quadro Societário &amp; Colaboradores</h2><p class="notice">Perfis vinculados oficialmente à entidade.</p><div class="team-grid" id="teamGrid"></div><div class="member-form" id="memberForm"><input id="memberUsername" maxlength="80" placeholder="Nome de usuário no Discord"><input id="memberRole" maxlength="100" placeholder="Cargo"><button id="addMember">Adicionar vinculado</button></div>';
        const sidebar = page.querySelector('.layout > aside');
        const infoCard = sidebar.querySelector('.card');
        infoCard.querySelector('h2')?.remove();
        infoCard.querySelector('.facts')?.remove();
        sidebar.insertBefore(section, sidebar.firstChild);
        document.getElementById('addMember').addEventListener('click', addMember);
      }
      document.getElementById('memberForm').style.display = isAdmin ? 'grid' : 'none';
      const host = document.getElementById('teamGrid');
      host.innerHTML = members.length ? members.map(member => `<article class="member"><b>${esc(member.name)}</b><span>${esc(member.role)}</span>${member.discord ? `<small>${esc(member.discord)}</small>` : ''}${isAdmin ? `<button data-member-id="${member.id}">Remover</button>` : ''}</article>`).join('') : '<p class="notice">A equipe ainda não foi cadastrada.</p>';
      host.innerHTML = members.length ? members.map(member => { const avatar = member.user.avatar ? `https://cdn.discordapp.com/avatars/${member.user.id}/${member.user.avatar}.${member.user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=128` : ''; return `<article class="member"><div class="member-avatar">${avatar ? `<img src="${avatar}" alt="">` : esc(initials(member.user.username))}</div><b>${esc(member.user.username)}</b><span>${esc(member.role)}</span>${isAdmin ? `<button data-member-id="${member.id}">Remover</button>` : ''}</article>`; }).join('') : '<p class="notice">Nenhum colaborador vinculado foi cadastrado.</p>';
      host.querySelectorAll('[data-member-id]').forEach(button => button.addEventListener('click', () => removeMember(button.dataset.memberId)));
    }
    async function loadMembers(){ const response = await fetch(api(`/api/empresas/${encodeURIComponent(id)}/colaboradores`), { cache:'no-store' }); if (!response.ok) return; members = (await response.json()).members || []; mountTeam(); }
    async function removeMember(memberId){ if(!confirm('Remover este colaborador?')) return; const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/colaboradores/${encodeURIComponent(memberId)}`),{method:'DELETE',credentials:'include'}); if(!response.ok) return alert('Não foi possível remover este colaborador.'); loadMembers(); }
    async function addMember(){ const username=document.getElementById('memberUsername').value.trim(), role=document.getElementById('memberRole').value.trim(); if(!username || !role) return alert('Informe o usuário do Discord e o cargo.'); const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/colaboradores`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,role})}); const data=await response.json(); if(!response.ok) return alert(data.error || 'Não foi possível adicionar este colaborador.'); document.getElementById('memberUsername').value='';document.getElementById('memberRole').value='';loadMembers(); }
    function enhanceCommunity(){ const composer=document.getElementById('commentComposer'); if(isAdmin && composer && !document.getElementById('communityImageUrl')) { const input=document.createElement('input'); input.id='communityImageUrl';input.placeholder='Imagem da publicação (URL HTTPS, opcional)';input.style.marginTop='8px';composer.querySelector('button').before(input); } }
    async function loadComments(){ const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{cache:'no-store'}); if(!response.ok)return; const data=await response.json(),host=document.getElementById('comments'); if(!host)return; host.innerHTML=(data.comments||[]).length?(data.comments||[]).map(comment=>{const avatar=comment.user.avatar?`https://cdn.discordapp.com/avatars/${comment.user.id}/${comment.user.avatar}.${comment.user.avatar.startsWith('a_')?'gif':'png'}?size=128`:'';return `<article class="comment"><div class="member-avatar">${avatar?`<img src="${avatar}" alt="">`:esc(initials(comment.user.username))}</div><strong>${esc(comment.user.username)}</strong><small> · ${new Date(comment.createdAt).toLocaleDateString('pt-BR')}</small><p>${esc(comment.body)}</p>${comment.imageUrl?`<img src="${esc(comment.imageUrl)}" alt="Imagem da publicação" style="width:100%;max-height:420px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">`:''}</article>`}).join(''):'<p class="notice">Ainda não há comentários. Seja a primeira pessoa a participar.</p>'; }
    async function sendComment(){const body=document.getElementById('commentBody').value.trim(),imageUrl=document.getElementById('communityImageUrl')?.value.trim()||'';if(!body)return;const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/comentarios`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,imageUrl})});const data=await response.json();if(!response.ok)return alert(data.error||'Não foi possível publicar o comentário.');document.getElementById('commentBody').value='';if(document.getElementById('communityImageUrl'))document.getElementById('communityImageUrl').value='';loadComments();}
    function ensureEntityLinkModal(){let modal=document.getElementById('entityLinkModal');if(modal)return modal;modal=document.createElement('div');modal.id='entityLinkModal';modal.className='post-edit-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');document.body.append(modal);modal.addEventListener('click',event=>{if(event.target===modal||event.target.closest('[data-close-link-modal]'))modal.classList.remove('open');});return modal;}
    async function refreshHeroLinkStatus(){const button=document.getElementById('heroLinkEntity');if(!button||!currentUser)return;try{const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/vinculo-status`),{credentials:'include',cache:'no-store'});if(!response.ok)return;const status=await response.json();if(status.linked){button.textContent='✓ Vinculado';button.disabled=true;button.classList.add('linked');}else if(status.pending){button.textContent='Solicitação pendente';button.disabled=true;}}catch(error){console.error(error);}}

    async function saveProfileEditor(event){event.preventDefault();const modal=document.getElementById('profileEditModal'),isHeader=modal.dataset.area==='header',submit=event.currentTarget.querySelector('[type="submit"]');const payload={name:company.name,entityType:company.entityType,industry:company.industry,estimatedNetWorth:company.estimatedNetWorth,profileTagline:isHeader?document.getElementById('editTagline').value.trim():company.profileTagline,description:isHeader?company.description:document.getElementById('editDescription').value.trim(),logoUrl:isHeader?document.getElementById('editLogo').value.trim():company.logoUrl,bannerUrl:isHeader?document.getElementById('editBanner').value.trim():company.bannerUrl};submit.disabled=true;submit.textContent='Salvando...';try{const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw new Error(data.error);company=data.company;modal.classList.remove('open');render();installInlineProfileEditors();if(isAdmin)mountAdminLinkRequests();}catch(error){alert(error.message||'Não foi possível salvar.');}finally{submit.disabled=false;submit.textContent='Salvar alterações';}}
    function installInlineProfileEditors(){if(!canManage)return;const admin=document.getElementById('admin');if(admin&&!isAdmin)admin.style.display='none';const heroText=page.querySelector('.hero-content > div:last-child');if(heroText&&!document.getElementById('editProfileHeader')){const button=document.createElement('button');button.type='button';button.id='editProfileHeader';button.className='context-edit-btn hero-edit-btn';button.textContent='Editar cabeçalho';button.addEventListener('click',()=>openProfileEditor('header'));heroText.append(button);}const about=[...page.querySelectorAll('.layout > div > .card')].find(card=>card.querySelector('h2')?.textContent==='Sobre a entidade');if(about&&!document.getElementById('editProfileDescription')){const button=document.createElement('button');button.type='button';button.id='editProfileDescription';button.className='context-edit-btn';button.textContent='Editar';button.addEventListener('click',()=>openProfileEditor('description'));about.querySelector('h2').append(button);}}
    async function mountAdminLinkRequests(){if(!isAdmin||!company)return;const admin=document.getElementById('admin');if(!admin)return;let section=document.getElementById('adminLinkRequests');if(!section){section=document.createElement('div');section.id='adminLinkRequests';section.className='admin';section.style.display='block';admin.append(section);}const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/solicitacoes-vinculo`),{credentials:'include',cache:'no-store'});if(!response.ok)return;const data=await response.json();section.innerHTML=`<h2>Pedidos de vinculação</h2>${data.requests.length?`<p class="notice">Apenas administradores visualizam e analisam estes pedidos.</p><div class="team-grid">${data.requests.map(request=>{const avatar=discordAvatar(request.user);return `<article class="member"><div class="member-avatar">${avatar?`<img src="${avatar}" alt="">`:esc(initials(request.user.username))}</div><b>${esc(request.user.username)}</b><span>Solicitou vínculo</span><button data-approve-request="${request.id}">Aprovar</button><button data-reject-request="${request.id}">Rejeitar</button></article>`;}).join('')}</div>`:'<p class="notice">Não há pedidos pendentes.</p>'}`;section.querySelectorAll('[data-approve-request]').forEach(button=>button.addEventListener('click',()=>reviewLinkRequest(button.dataset.approveRequest,true)));section.querySelectorAll('[data-reject-request]').forEach(button=>button.addEventListener('click',()=>reviewLinkRequest(button.dataset.rejectRequest,false)));}
    async function reviewLinkRequest(requestId,approved){if(!approved&&!confirm('Rejeitar este pedido de vinculação?'))return;const path=approved?`/api/empresas/${encodeURIComponent(id)}/solicitacoes-vinculo/${encodeURIComponent(requestId)}/aprovar`:`/api/empresas/${encodeURIComponent(id)}/solicitacoes-vinculo/${encodeURIComponent(requestId)}`;const response=await fetch(api(path),{method:approved?'POST':'DELETE',credentials:'include'});if(!response.ok)return alert('Não foi possível atualizar o pedido.');mountAdminLinkRequests();if(approved)loadMembers();}
    async function resolveCompanyAccess(){
      if (!currentUser || !company) return;
      const response = await fetch(api('/api/my-company'), { credentials:'include' });
      const data = await response.json();
      canManage = isAdmin || (data.companies || [data.company].filter(Boolean)).some(item => String(item.id) === String(company.id));
      if (!canManage) { document.getElementById('admin')?.closest('.card')?.remove(); return; }
      document.getElementById('admin') && (document.getElementById('admin').style.display = 'block');
      refreshOfficialControls();
      installPostEditors();
      installInlineProfileEditors();
      mountAdminLinkRequests();
    }
    const companyAccessWatcher = setInterval(() => { if (company && currentUser) { clearInterval(companyAccessWatcher); resolveCompanyAccess(); } }, 150);
    const postEditorWatcher = setInterval(installPostEditors, 500);
    async function saveProfile(){ const payload={name:company.name,entityType:company.entityType,industry:company.industry,estimatedNetWorth:company.estimatedNetWorth,profileTagline:document.getElementById('tagline')?.value.trim() || company.profileTagline,description:document.getElementById('description')?.value.trim() || '',logoUrl:document.getElementById('logoUrl')?.value.trim() || company.logoUrl,bannerUrl:document.getElementById('bannerUrl')?.value.trim() || company.bannerUrl}; const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); const data=await response.json(); if(!response.ok)return alert(data.error||'Não foi possível salvar.'); company=data.company;render(); }
    const discordAvatar = user => user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${user.avatar.startsWith('a_') ? 'gif' : 'png'}?size=128` : '';
    let selectedReviewRating=0;
    function paintStars(value){document.querySelectorAll('#ratingButtons button').forEach((button,index)=>{button.style.color=index<value?'#ffca6a':'#617080';});}
    function reviewStars(value){return `<span aria-label="${value} de 5 estrelas" style="color:#ffca6a;letter-spacing:2px">${'★'.repeat(value)}<span style="color:#617080">${'★'.repeat(5-value)}</span></span>`;}
    async function loadFeedback(){const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/opinioes`),{credentials:'include',cache:'no-store'});if(!response.ok)return;const data=await response.json(),host=document.getElementById('feedbackComments');if(!host)return;document.getElementById('feedbackRating').textContent=data.count?`${data.average.toFixed(1)} / 5 · ${data.count} opinião${data.count===1?'':'ões'}`:'Ainda não há opiniões.';host.innerHTML=data.comments.length?data.comments.map(comment=>`<article class="comment"><div class="member-avatar">${discordAvatar(comment.user)?`<img src="${discordAvatar(comment.user)}" alt="">`:esc(initials(comment.user.username))}</div><strong>${esc(comment.user.username)}</strong><small> · ${new Date(comment.updatedAt||comment.createdAt).toLocaleDateString('pt-BR')}</small>${reviewStars(Number(comment.rating))}${isAdmin?`<button data-delete-review="${comment.id}" style="float:right">Excluir</button>`:''}<p>${esc(comment.body)}</p></article>`).join(''):'<p class="notice">Ainda não há opiniões sobre esta entidade.</p>';host.querySelectorAll('[data-delete-review]').forEach(button=>button.addEventListener('click',()=>deleteReview(button.dataset.deleteReview)));if(data.myReview){selectedReviewRating=Number(data.myReview.rating);paintStars(selectedReviewRating);const field=document.getElementById('feedbackBody');if(field){field.value=data.myReview.body;field.placeholder='Edite sua opinião vinculada ao Discord';}const submit=document.getElementById('sendFeedback');if(submit)submit.textContent='Salvar minha opinião';}}
    async function sendFeedback(){const field=document.getElementById('feedbackBody'),body=field.value.trim();if(!selectedReviewRating||!body)return alert('Escolha de 1 a 5 estrelas e escreva sua opinião.');const response=await fetch(api(`/api/empresas/${encodeURIComponent(id)}/opinioes`),{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({body,rating:selectedReviewRating})});const data=await response.json();if(!response.ok)return alert(data.error||'Entre com Discord para publicar.');loadFeedback();}
    async function deleteReview(reviewId){if(!confirm('Excluir esta opinião?'))return;const response=await fetch(api(`/api/opinioes/${encodeURIComponent(reviewId)}`),{method:'DELETE',credentials:'include'});if(!response.ok)return alert('Não foi possível excluir a opinião.');loadFeedback();}
    function mountFeedback(){
      if (!company || document.getElementById('feedbackSection')) return;
      const section=document.createElement('section'); section.id='feedbackSection';section.className='card';section.style.marginTop='22px';
      section.innerHTML=`<h2>Avaliações e comentários</h2><p id="feedbackRating" class="notice">Avaliações identificadas pelo perfil Discord.</p><div id="feedbackComments"></div><div id="feedbackComposer" style="display:none"><p class="notice">Uma única opinião por pessoa, com estrelas e comentário. Você poderá editar a sua quando quiser.</p><div id="ratingButtons" style="display:flex;gap:6px;font-size:25px"></div><textarea id="feedbackBody" rows="3" maxlength="1500" placeholder="Escreva sua opinião sobre esta entidade"></textarea><button id="sendFeedback">Publicar minha opinião</button></div>`;
      page.querySelector('#comments').closest('.card').insertAdjacentElement('afterend',section);
      const buttons=document.getElementById('ratingButtons');[1,2,3,4,5].forEach(value=>{const button=document.createElement('button');button.type='button';button.textContent='★';button.title=`${value} estrela${value>1?'s':''}`;button.style.cssText='margin:0;padding:0;background:transparent;color:#617080;font-size:25px';button.addEventListener('click',()=>{selectedReviewRating=value;paintStars(value);});buttons.append(button);});
      if(currentUser)document.getElementById('feedbackComposer').style.display='block'; document.getElementById('sendFeedback').addEventListener('click',sendFeedback);loadFeedback();
    }
    const feedbackWatcher=setInterval(()=>{if(company&&page.querySelector('.layout')){mountFeedback();if(document.getElementById('feedbackSection'))clearInterval(feedbackWatcher);}},150);
    function attachPostCreator(){
      const composer = document.getElementById('commentComposer'), postsCard = document.getElementById('comments')?.closest('.card');
      if (!composer || !postsCard) return;
      let creator = document.getElementById('postCreatorSection');
      if (!creator) {
        creator = document.createElement('section'); creator.id = 'postCreatorSection'; creator.className = 'card'; creator.style.marginTop = '22px';
        creator.innerHTML = '<h2>Criar publicação</h2><p class="notice">Publicações oficiais da entidade.</p>';
        postsCard.insertAdjacentElement('afterend', creator); creator.append(composer);
      }
      creator.style.display = canManage ? 'block' : 'none';
    }
    async function decorateYoutubeEmbeds(){
      const host = document.getElementById('comments'); if (!host) return;
      const response = await fetch(api(`/api/empresas/${encodeURIComponent(id)}/posts`), { cache:'no-store' }); if (!response.ok) return;
      const data = await response.json();
      [...host.children].forEach((article, index) => {
        const post = data.posts[index]; if (!post || post.mediaType !== 'youtube' || article.dataset.youtubeEmbedded) return;
        const image = article.querySelector(':scope > img'); if (!image) return;
        const frame = document.createElement('iframe'); frame.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(post.youtubeId)}`; frame.title = 'Vídeo do YouTube'; frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; frame.allowFullscreen = true; frame.style.cssText = 'width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000';
        image.replaceWith(frame); article.dataset.youtubeEmbedded = 'true';
      });
    }
    async function togglePin(postId, pinned){ const response=await fetch(api(`/api/posts/${encodeURIComponent(postId)}/fixar`),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({pinned})}); if(!response.ok)return alert('Não foi possível atualizar o destaque.'); loadComments(); }
    function installPostPinning(){
      if (!isAdmin) return;
      document.querySelectorAll('[id^="postComment-"]').forEach(field => {
        const postId = field.id.slice('postComment-'.length), article = field.closest('article.comment'); if (!article || article.querySelector('[data-pin-post]')) return;
        const button=document.createElement('button');button.type='button';button.dataset.pinPost=postId;button.textContent='Fixar no topo';button.addEventListener('click',()=>togglePin(postId,true));article.append(button);
      });
    }
    const postAreaWatcher = setInterval(() => {
      if (!company || !document.getElementById('comments')) return;
      attachPostCreator(); installPostEditors(); installPostPinning(); decorateYoutubeEmbeds();
    }, 600);
  </script>
</body>
